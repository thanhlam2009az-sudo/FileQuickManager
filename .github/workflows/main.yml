
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app without signing
        run: |
          xcodebuild \
            -project FileQuickManager.xcodeproj \
            -scheme FileQuickManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FileQuickManager.app Payload/
          /usr/bin/zip -qry FileQuickManager-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileQuickManager-unsigned-ipa
          path: FileQuickManager-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
