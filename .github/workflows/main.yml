
name: Build FileQuickManager IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcode-select -p

      - name: Find Xcode project
        run: |
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Build app
        run: |
          xcodebuild -list -project FileQuickManager.xcodeproj
